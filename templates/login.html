<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SEPNIX VPS HOSTING</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body { background: #080a10; }
        .sepnix-gradient { background: linear-gradient(135deg, #8b5cf6, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .login-card { background: #0e1018; border: 1px solid rgba(139,92,246,0.3); border-radius: 20px; box-shadow: 0 25px 50px rgba(139,92,246,0.1); }
        .glow-bg { background: radial-gradient(circle at 50% 0%, rgba(139,92,246,0.15), transparent 60%); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 glow-bg">
    <div class="login-card p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-tr from-purple-600 to-cyan-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-purple-500/30">
                <i class="fas fa-bolt text-4xl text-white"></i>
            </div>
            <h1 class="text-3xl font-black text-white">SEPNIX <span class="sepnix-gradient">VPS</span></h1>
            <p class="text-gray-500 text-sm mt-1">Premium Hosting Platform</p>
        </div>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/30 rounded-lg p-3 mb-4 text-red-400 text-sm text-center">
            <i class="fas fa-exclamation-triangle mr-2"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="mb-4">
                <label class="block text-gray-400 text-sm mb-2">Username</label>
                <input type="text" name="username" required
                    class="w-full bg-[#080a10] border border-gray-800 rounded-lg px-4 py-3 text-white focus:border-purple-500 focus:outline-none transition">
            </div>
            <div class="mb-6">
                <label class="block text-gray-400 text-sm mb-2">Password</label>
                <input type="password" name="password" required
                    class="w-full bg-[#080a10] border border-gray-800 rounded-lg px-4 py-3 text-white focus:border-purple-500 focus:outline-none transition">
            </div>
            <button type="submit"
                class="w-full bg-gradient-to-r from-purple-600 to-cyan-500 hover:from-purple-500 hover:to-cyan-400 text-white font-bold py-3 rounded-lg transition transform hover:scale-[1.02] shadow-lg shadow-purple-500/25">
                <i class="fas fa-sign-in-alt mr-2"></i> Login
            </button>
        </form>

        <div class="text-center mt-6">
            <p class="text-gray-600 text-xs"><i class="fas fa-shield-alt mr-1"></i> Secured by SEPNIX</p>
        </div>
    </div>
</body>
</html>
